<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="SigIQ — PowerHouse_4318 — Smart India Hackathon 2026"
    >

    <title>SigIQ — PowerHouse_4318</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>

    <main class="page">


        <!-- =========================================
             HEADER
        ========================================== -->

        <header class="header">

            <div
                class="team"
                id="teamName"
            >
                PowerHouse_4318
            </div>


            <div
                class="event"
                id="event"
            >
                SIH 2026 · PS 26147
            </div>

        </header>



        <!-- =========================================
             PROJECT INTRO
        ========================================== -->

        <section class="intro">

            <h1 id="projectName">
                SigIQ
            </h1>


            <p
                class="description"
                id="description"
            >
                SigIQ analyzes raw IQ and WAV recordings
                to identify signal characteristics, evaluate
                modulation hypotheses, and recover supported
                signal information.
            </p>


            <!-- =====================================
                 PROJECT LINKS
            ====================================== -->

            <nav
                class="links"
                id="links"
                aria-label="Project resources"
            >

                <!-- Links are loaded from JSON -->

            </nav>

        </section>



        <!-- =========================================
             SCREENSHOTS
        ========================================== -->

        <section
            class="screens"
            id="screens"
            aria-label="SigIQ application screenshots"
        >

            <div class="showcase-image-frame">
                <img
                    class="showcase-image"
                    id="screenshotImage"
                    alt=""
                >
            </div>

            <div class="showcase-caption" aria-live="polite">
                <h2 id="screenshotTitle"></h2>
                <p id="screenshotDescription"></p>
            </div>

            <nav class="slide-controls" aria-label="Screenshot navigation">
                <button class="slide-arrow" id="previousScreenshot" type="button" aria-label="Previous screenshot">&#8249;</button>
                <div class="slide-indicators" id="slideIndicators" aria-label="Choose screenshot"></div>
                <button class="slide-arrow" id="nextScreenshot" type="button" aria-label="Next screenshot">&#8250;</button>
            </nav>

        </section>


    </main>


    <script src="script.js?v=20261006"></script>

</body>

</html>
